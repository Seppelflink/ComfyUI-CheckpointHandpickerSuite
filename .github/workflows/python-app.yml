name: Python pytest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Install runtime deps for tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy aiohttp pillow --quiet
      - name: Run pytest
        run: |
          python -m pytest -q
